<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：頁首 → 專案名稱 → 單一流程（收集→整理→畫圖及規格→開發→共用看過程）→ 該階段畫面；手機改單欄
   色彩：石墨灰的冷調中性色＋琥珀橘重點色（暖色的科技感） */
:root{
  --bg:#f3f2ef; --panel:#ffffff; --ink:#1e1d1b; --muted:#6a655d; --line:#dedad2; --soft:#f8f7f4;
  --accent:#c2540a; --accent-ink:#ffffff; --accent-soft:#fbeadb;
  --s-todo:#8a948f; --s-working:#2f6fb8; --s-done:#2e8b57; --s-blocked:#c0392b; --s-review:#c28a00;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --panel:#1a1d22; --ink:#ebe7e1; --muted:#9c968c; --line:#2b2f36; --soft:#16191d;
  --accent:#ff9447; --accent-ink:#1a1209; --accent-soft:#3a2617;
  --s-todo:#7d8883; --s-working:#6ea6e6; --s-done:#5cc28a; --s-blocked:#ef7a6d; --s-review:#e6b84a;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans)}
button,textarea,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
header .brand{font-weight:700;font-size:15px;letter-spacing:.04em}
header .sp{flex:1}
.who{font-size:12px;color:var(--muted)}
select,.btn,input[type=text],input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--soft);resize:vertical}
input[type=text]{width:100%}
label.f{display:grid;gap:4px;font-size:13px}
label.f>span{color:var(--muted);font-size:12.5px}

.pbar{display:grid;gap:8px}
.pbar h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.purpose{color:var(--muted);max-width:70ch;margin:0}
.meta-line{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ver{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.steps{display:flex;gap:0;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:2px 0}
.step .no{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono)}
.step.done .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.cur{color:var(--ink);font-weight:700}
.step.cur .no{border-color:var(--accent);color:var(--accent)}
.step+.step::before{content:"";width:22px;height:1.5px;background:var(--line);margin:0 8px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .c{font-family:var(--mono);font-size:11.5px;margin-left:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.card h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card .in{padding:14px;display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.two.flip{grid-template-columns:360px minmax(0,1fr)}
.req{font-style:normal;font-size:11px;color:var(--accent);margin-left:4px}
details.older{border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
details.older summary{cursor:pointer;color:var(--muted);font-size:13px}
.diff{display:grid;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
.diff .add{color:var(--s-done)}.diff .chg{color:var(--s-working)}.diff .del{color:var(--s-blocked)}
.empty{color:var(--muted);font-size:13px;margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* 需求卡片 */
.need{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;display:grid;gap:8px}
.ntopic{font-weight:700;font-size:15px;line-height:1.4}
.roundhd{font-size:12.5px;color:var(--muted);letter-spacing:.06em;font-weight:700;margin:6px 0 0}
.need .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.need .hd b{color:var(--ink);font-weight:500}
.need .hd .nid{font-family:var(--mono);font-size:11px}
.need dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.need dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.need dd{margin:0;min-width:0;word-break:break-word;white-space:pre-wrap}
.need .ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plus{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:1px 10px;font-size:12.5px;cursor:pointer}
.plus.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.cmts{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.cmt{font-size:13px}
.cmt .by{color:var(--muted);font-size:12px;margin-right:6px}
.crow{display:flex;gap:6px}
.crow input{flex:1}
.ttag{font-size:11.5px;border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--accent)}
.list{display:grid;gap:10px}

/* 主題 */
.theme{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;background:var(--panel)}
.theme .tt{font-weight:700;font-size:15px}
.theme .src{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--soft)}
.conflict{border-left:3px solid var(--s-review);background:var(--soft);padding:6px 10px;font-size:13px;border-radius:0 6px 6px 0}
.conflict b{color:var(--s-review)}
.decision{border-left:3px solid var(--s-done);background:var(--soft);padding:6px 10px;font-size:13px;border-radius:0 6px 6px 0}
.tedit{display:grid;gap:8px}
.tedit .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* 規格 */
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:360px;line-height:1.5;white-space:pre;overflow:auto}
.warn{font-size:13px;display:grid;gap:4px;margin:0;padding-left:18px;color:var(--s-review)}
.ok{font-size:13px;color:var(--s-done);margin:0}
.nlist{display:grid;gap:8px}
.nitem{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.nitem .h{font-weight:500}
.nitem .h .id{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.nitem ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}

/* 流程圖（共用） */
.graph{overflow:auto;padding:12px}
.graph svg{display:block}
.graph .edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.graph .etxt{fill:var(--muted);font-size:12.5px;font-family:var(--sans)}
.graph .node rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1}
.graph .node{cursor:pointer}
.graph .node:hover rect.box{stroke:var(--accent)}
.graph .node.sel rect.box{stroke:var(--accent);stroke-width:2.5}
.graph .node .lb{fill:var(--ink);font-size:15px;font-weight:500;font-family:var(--sans)}
.graph .node .st{font-size:12.5px;font-family:var(--sans)}
.graph .node .q{fill:var(--s-review);font-size:12px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* 開發 */
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.pill b{font-variant-numeric:tabular-nums}
.detail{padding:14px;display:grid;gap:12px;align-content:start}
.detail .ttl{font-size:16px;font-weight:700;margin:0}
.detail .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.acc{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.acc li{display:flex;gap:8px;font-size:13px}
.acc .aid{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.latest{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.arts{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.arts a{color:var(--accent);word-break:break-all}
.arts .path{font-family:var(--mono);font-size:12px;word-break:break-all}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.qs,.tl{padding:6px 14px 14px;display:grid}
.q{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.q:last-child{border-bottom:none}
.q .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.q .text{font-weight:500}
.q textarea{min-height:60px}
.q .row{display:flex;justify-content:flex-end}
.q .ans{font-size:13px;background:var(--soft);border-radius:6px;padding:6px 10px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .body{min-width:0;font-size:13px}
.ev .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .nd{font-weight:500}
.who2{font-size:11.5px;color:var(--muted)}

/* 首頁專案清單 */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font-weight:700;font-size:15px}
.pcard .ph{font-size:12px;color:var(--accent);font-weight:500}

.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--s-blocked);border-radius:6px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:9}
.loading{color:var(--muted);font-size:13px}

@media (max-width:900px){ .two,.two.flip,.bottom{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }

/* 單一流程導覽 */
.titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fstep{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;color:var(--muted);font-size:13.5px;position:relative}
.fstep .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--mono);border:1.5px solid var(--line);background:var(--soft)}
.fstep.done .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fstep.cur{color:var(--ink);font-weight:700;border-color:var(--accent)}
.fstep.cur .no{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fstep.open .no{border-style:dashed}
.fstep.on{box-shadow:0 0 0 2px var(--accent);color:var(--ink)}
.fstep:disabled{opacity:.45;cursor:default}
.fstep .now{font-size:11px;font-weight:500;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 7px}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:6px;height:1.5px;background:var(--line)}
.stagebar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.stagebar .hint{max-width:72ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
#tabBody{margin-top:2px}
.aibar{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.aibar .sp{flex:1}
.warnc{color:var(--s-review)!important}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent-ink);color:var(--accent);font-size:11.5px;font-family:var(--mono)}
.mini{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;display:grid;gap:2px}
.mini.un{border-style:dashed}
.hero .in{padding:28px;justify-items:start}
.pubrow{display:grid}
.btn.big{padding:10px 16px;font-size:15px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row.left{justify-content:flex-start}
.clist{display:grid;gap:8px;margin-bottom:8px}
.cm{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;display:grid;gap:3px}
.cm .meta{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cm .meta b{color:var(--ink);font-weight:500}
.cm .cst{margin-left:auto}
.cm.open{border-left:3px solid var(--s-review)}
.cm.resolved,.cm.ignored{opacity:.7}
.cm .row{justify-content:flex-start;gap:12px}
/* 對話框 */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:100%;height:min(760px,100%);display:flex;flex-direction:column;min-height:0}
.mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mh .sp{flex:1}
.mbody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:9px 12px;border-radius:10px;display:grid;gap:4px}
.msg.user{align-self:flex-end;background:var(--accent-soft)}
.msg.ai{align-self:flex-start;background:var(--soft);border:1px solid var(--line)}
.mtext{white-space:pre-wrap;word-break:break-word}
.mlog{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.mfoot{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.mfoot .crow{align-items:flex-end}
.mfoot textarea{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.vrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.vinfo{flex:1;min-width:0;font-size:13px}
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;z-index:30}
.busy .card{padding:18px 22px;display:flex;gap:10px;align-items:center}
.keyhelp{border:1px solid var(--s-review);border-left-width:4px;border-radius:6px;background:var(--panel);padding:10px 14px;font-size:13px;margin-bottom:14px}
.keyhelp ol{margin:6px 0 0;padding-left:20px;display:grid;gap:2px}
.keyhelp code{font-family:var(--mono);background:var(--soft);padding:0 4px;border-radius:3px}
.mini .tag{justify-self:start}
/* 成果 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px;background:var(--panel)}
.segb{border:none;background:none;padding:6px 18px;cursor:pointer;color:var(--muted)}
.segb.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
#outBody{display:grid;gap:14px}
.prog{display:grid;gap:8px}
.bar{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--s-done)}
.demos{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.demo{display:grid;gap:2px;border:1.5px solid var(--accent);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--accent-soft)}
.demo .go{color:var(--accent);font-weight:700;font-size:13px}
.gallery{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.shot{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--soft)}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.shot .noimg{aspect-ratio:16/10;display:grid;place-items:center;color:var(--muted);font-size:13px}
.shot .cap{display:grid;padding:8px 10px;background:var(--panel)}
.dlist{display:grid;gap:12px}
.ditem{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ditem:last-child{border-bottom:none;padding-bottom:0}
.dh{display:flex;gap:8px;align-items:center}
.drow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
.drow a{color:var(--accent);word-break:break-all}
.codebox summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-size:13px}
a.chipbtn{text-decoration:none;color:var(--ink)}
/* 時間軸 */
.day{display:grid;gap:6px;padding-bottom:10px}
.dhd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:4px}
.tli{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;font-size:13.5px}
.tli .t{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tli .dot{transform:translateY(1px)}
@media (max-width:900px){ .fstep{padding-right:10px} .fstep:not(:last-child)::after{display:none} .mbox{height:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">使用者共創</span>
    <button class="btn sm" id="homeBtn" hidden>所有專案</button>
    <span class="sp"></span>
    <button class="btn sm" id="refresh">重新整理</button>
    <span class="who" id="who"></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="view"><p class="loading">讀取中…</p></div>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="busy" id="busy" hidden><div class="card"><span class="spin"></span><span id="busyMsg">處理中…</span></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= 共用 ================= */
const PH = {collecting:'收集', organizing:'整理', drafting:'畫圖及規格', developing:'開發'};
const PH_ORDER = ['collecting','organizing','drafting','developing'];
const ST = {
  todo:{zh:'未開始',c:'--s-todo'}, working:{zh:'進行中',c:'--s-working'}, done:{zh:'完成',c:'--s-done'},
  blocked:{zh:'卡住',c:'--s-blocked'}, needs_review:{zh:'待確認',c:'--s-review'}
};
const TYPE_ZH = {input:'輸入',llm:'AI 判斷／生成',retrieve:'查資料',condition:'分流',tool:'程式處理',output:'輸出'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = ts => { const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const who = a => String(a||'').replace(/^agent:/,'AI · ').replace(/^agent$/,'AI').replace(/@.*/,'');
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }
function banner(m){ $('banner').textContent=m; $('banner').hidden=!m; }
function run(fn,...args){ return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)); }
async function act(btn, fn, ...args){
  const label = btn && btn.textContent; if(btn){ btn.disabled=true; btn.textContent='處理中…'; }
  try { return await run(fn,...args); }
  catch(e){ toast((e&&e.message)||'發生錯誤，請再試一次'); throw e; }
  finally { if(btn){ btn.disabled=false; btn.textContent=label; } }
}
function copyText(text){
  const done=()=>toast('已複製，貼到 Claude 或 Gemini 的對話裡');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('無法自動複製，請手動選取');} ta.remove(); }
}
function parseLoose(text){
  let t=String(text||'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  const cands=[t]; if(a>=0&&b>a) cands.push(t.slice(a,b+1));
  // 手機、輸入法常把 " 換成彎引號：先試只換結構位置的，再試全部換掉
  const smart=x=>x.replace(/([{\[,:]\s*)[“”„‟″]/g,'$1"').replace(/[“”„‟″](\s*[:,}\]])/g,'"$1');
  const all=x=>x.replace(/[“”„‟″]/g,'"').replace(/[‘’]/g,"'");
  for(const c of cands) for(const f of [x=>x, smart, all]){ try{ return JSON.parse(f(c)); }catch(e){} }
  return null;
}

let S = { user:'', isOwner:false, projects:[], project:null, view:null, plan:null, dev:null, sel:null, tlFilter:null, timeline:null };

/* ================= 首頁：專案清單 ================= */
async function loadHome(){
  const r = await run('pageProjects');
  S.user=r.user; S.isOwner=r.isOwner; S.projects=r.projects;
  $('who').textContent=r.user+(r.isOwner?'（管理者）':'');
  return r;
}
function renderHome(){
  S.project=null; $('homeBtn').hidden=true;
  const order=p=>PH_ORDER.indexOf(p.status);
  const list=S.projects.slice().sort((a,b)=>order(a)-order(b));
  $('view').innerHTML=`
    <div class="pbar"><h1>所有專案</h1><p class="purpose">點選專案，提出需求、查看整理結果和開發進度。</p></div>
    ${S.isOwner?`<section class="card" style="margin-top:14px"><h2>開新專案</h2><form class="in" id="newProj">
      <div class="two" style="grid-template-columns:1fr 1fr">
        <label class="f"><span>專案名稱</span><input type="text" id="np_title" placeholder="例：請假單自動化" required></label>
        <label class="f"><span>專案代號（英文小寫、數字、-）</span><input type="text" id="np_id" placeholder="例：leave-form" required></label>
      </div>
      <label class="f"><span>想解決什麼（給同事看的一兩句話）</span><textarea id="np_purpose" rows="2" placeholder="例：請假流程要跑三個人簽核，常常卡住，想看看能不能簡化。"></textarea></label>
      <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
        <label class="f"><span>需求收集截止日（選填）</span><input type="date" id="np_due"></label>
        <span style="flex:1"></span><button class="btn primary" id="np_btn">建立並開始收集需求</button>
      </div></form></section>`:''}
    <div class="plist" style="margin-top:14px">${list.length?list.map(p=>`
      <button class="pcard" data-p="${esc(p.project)}">
        <span class="ph">${(p.round||1)>1?`第 ${p.round} 輪 · `:''}${PH[p.status]||p.status}${p.version?` · 已上線 v${p.version}`:''}</span>
        <span class="t">${esc(p.title||p.project)}</span>
        ${p.purpose?`<span class="hint">${esc(p.purpose)}</span>`:''}
        <span class="who2">${p.needs?`${p.needs} 則需求`:''}${p.due?`　截止 ${esc(String(p.due).slice(0,10))}`:''}</span>
      </button>`).join(''):`<p class="empty">還沒有任何專案。${S.isOwner?'用上方表單開第一個。':'等管理者開專案後，這裡會出現。'}</p>`}</div>`;
  $('view').querySelectorAll('.pcard').forEach(b=>b.onclick=()=>openProject(b.dataset.p));
  const f=$('newProj'); if(f){
    f.onsubmit=async e=>{ e.preventDefault();
      const r=await act($('np_btn'),'pageCreateProject',{project:$('np_id').value,title:$('np_title').value,purpose:$('np_purpose').value,due:$('np_due').value}).catch(()=>null);
      if(r){ toast('專案已建立'); await loadHome(); openProject(r.project); } };
  }
}

/* ================= 專案頁：單一流程 ================= */
const STEPS = [['collecting','收集'],['organizing','整理'],['drafting','畫圖及規格'],['developing','開發'],['process','共用看成果與過程']];
const STAGE_HINT = {
  collecting:'大家寫下想解決的問題或期望，看到一樣的就按「＋1」。',
  organizing:'把需求歸納成主題，意見不同的地方列為「待決定」。',
  drafting:'把主題畫成流程圖、寫下每一步的驗收標準。每個人都可以點節點提意見，管理者再用 AI 對話把意見整理進去。',
  developing:'規格定稿後由 AI Agent 開發，進度、提問和產出物都在這裡。',
  process:'「成果」看 AI Agent 做出來的東西；「過程」看從第一則需求到現在發生過的事。'
};
function proj(){ return S.projects.find(p=>p.project===S.project)||{}; }
function phaseIdx(){ return PH_ORDER.indexOf(proj().status); }
function canEdit(view){ return S.isOwner && view===proj().status; }

async function openProject(id, view){
  S.project=id; S.sel=null; S.tlFilter=null; S.timeline=null; $('homeBtn').hidden=false;
  if(google.script.history) google.script.history.replace(null,{project:id});
  S.view = view || proj().status || 'collecting';
  await refreshProject();
}
async function refreshProject(){
  const p=proj(), jobs=[];
  if(!p.external) jobs.push(run('pagePlanning',S.project).then(r=>S.plan=r));
  else S.plan={needs:[],themes:[],draft:'',drafts:[],chats:[],comments:[],round:1,info:null};
  if(p.version>0) jobs.push(run('pageData',S.project).then(r=>S.dev=r)); else S.dev=null;
  if(S.view==='process') jobs.push(run('pageTimeline',S.project).then(r=>S.timeline=r.items));
  await Promise.all(jobs);
  renderProject();
}
function stepState(key){
  const cur=phaseIdx(), i=PH_ORDER.indexOf(key);
  if(key==='process') return 'open';
  if(i<cur) return 'done';
  if(i===cur) return 'cur';
  if(key==='developing'&&S.dev) return 'done';   // 新一輪進行中，上一版的開發仍可看
  return 'future';
}
function renderProject(){
  const p=proj(), R=curRound();
  $('view').innerHTML=`
    <div class="pbar">
      <div class="titlerow"><h1>${esc(p.title||p.project)}</h1>
        ${R>1?`<span class="ver">第 ${R} 輪</span>`:''}${p.version?`<span class="ver">已上線 v${p.version}</span>`:''}</div>
      ${p.purpose?`<p class="purpose">${esc(p.purpose)}</p>`:''}
    </div>
    <nav class="flow" aria-label="專案流程">${STEPS.map(([k,l],i)=>{ const st=stepState(k);
      return `<button class="fstep ${st} ${S.view===k?'on':''}" data-view="${k}" ${st==='future'?'disabled':''} aria-current="${S.view===k?'step':'false'}">
        <span class="no">${st==='done'?'✓':k==='process'?'◎':i+1}</span><span class="lb">${l}</span>${st==='cur'?'<span class="now">進行中</span>':''}</button>`; }).join('')}</nav>
    <div class="stagebar">
      <p class="hint">${STAGE_HINT[S.view]}${S.view!=='process'&&stepState(S.view)==='done'&&S.view!=='developing'?'　<b>這個階段已完成，內容僅供查看。</b>':''}</p>
      <div class="acts">${S.isOwner?stageActions():''}</div>
    </div>
    <div id="tabBody"></div>`;
  $('view').querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{
    S.view=b.dataset.view; S.sel=null;
    if(S.view==='process'&&!S.timeline){ renderProject(); S.timeline=(await run('pageTimeline',S.project)).items; }
    renderProject(); });
  bindStageActions();
  ({collecting:renderNeeds,organizing:renderThemes,drafting:renderSpec,developing:renderDev,process:renderProcess})[S.view]();
}
function stageActions(){
  const st=proj().status, R=curRound(), b=[];
  if(S.view!==st && !(S.view==='developing'&&st==='developing')) return '';
  if(st==='collecting'){ if(R>1) b.push(`<button class="btn sm" id="cancelRound">取消這一輪</button>`); b.push(`<button class="btn primary" data-phase="organizing">完成收集，進入整理 →</button>`); }
  if(st==='organizing'){ b.push(`<button class="btn sm" data-phase="collecting">← 退回收集</button>`,`<button class="btn primary" data-phase="drafting">完成整理，進入畫圖及規格 →</button>`); }
  if(st==='drafting'){ b.push(`<button class="btn sm" data-phase="organizing">← 退回整理</button>`); }
  if(st==='developing'){ b.push(`<button class="btn" id="nextRound">開始第 ${R+1} 輪需求</button>`); }
  return b.join('');
}
function bindStageActions(){
  $('view').querySelectorAll('[data-phase]').forEach(b=>b.onclick=async()=>{
    const r=await act(b,'pageSetPhase',S.project,b.dataset.phase).catch(()=>null); if(!r) return;
    S.plan=r; proj().status=b.dataset.phase; S.view=b.dataset.phase; S.timeline=null; renderProject(); toast('進入「'+PH[b.dataset.phase]+'」');
    // 進入整理／畫圖時自動請 AI 開始（已經有內容就不重跑，避免蓋掉）
    if(!r.aiReady) return;
    const hasThemes=(r.themes||[]).some(t=>(t.needIds||[]).length||t.summary), d=parseLoose(r.draft||'');
    if(b.dataset.phase==='organizing'&&!hasThemes&&roundNeeds(curRound()).length) aiThemesRun('');
    if(b.dataset.phase==='drafting'&&!(d&&d.nodes&&d.nodes.length)) aiSpecRun(); });
  const nr=$('nextRound'); if(nr) nr.onclick=async()=>{
    if(nr.dataset.armed!=='1'){ nr.dataset.armed='1'; nr.textContent='再按一次：回到收集（開發進度會保留）'; return; }
    const r=await act(nr,'pageNextRound',S.project).catch(()=>null); if(!r) return;
    S.plan=r; Object.assign(proj(),{status:'collecting',round:r.round,external:false}); S.view='collecting'; S.timeline=null; renderProject(); toast(`第 ${r.round} 輪開始收集需求`); };
  const cr=$('cancelRound'); if(cr) cr.onclick=async()=>{
    if(cr.dataset.armed!=='1'){ cr.dataset.armed='1'; cr.textContent='再按一次確定取消'; return; }
    const r=await act(cr,'pageCancelRound',S.project).catch(()=>null); if(!r) return;
    S.plan=r; Object.assign(proj(),{status:'developing',round:r.round}); S.view='developing'; S.timeline=null; renderProject(); toast('已取消，回到開發'); };
}

/* ---------- ② 整理 ---------- */
function renderThemes(){
  const edit=canEdit('organizing'), themes=S.plan.themes, needs=roundNeeds(curRound());
  const nmap=Object.fromEntries(S.plan.needs.map(n=>[n.id,n]));
  const unassigned=needs.filter(n=>!themeOf(n.id));
  const ok=S.plan.aiReady, realThemes=themes.filter(t=>(t.needIds||[]).length||t.summary);
  const aiBar = edit ? `<div class="aibar">
      <button class="btn ${realThemes.length?'':'primary'}" id="aiThemes" ${needs.length&&ok?'':'disabled'}>${realThemes.length?'AI 重新整理全部需求':`AI 整理 ${needs.length} 則需求`}</button>
      ${realThemes.length?`<button class="btn primary" id="openThemeChat" ${ok?'':'disabled'}>與 AI 對話修改主題</button>`:''}
      <button class="btn" id="addTheme">手動新增主題</button>
    </div>${ok?'':keyHelp()}` : '';
  $('tabBody').innerHTML=`${aiBar}<div class="two">
    <div class="list">
      ${themes.length?themes.map((t,i)=>`<article class="theme">
        <div class="tt">${esc(t.title)}</div>
        ${t.summary?`<div>${esc(t.summary)}</div>`:''}
        <div class="src">${(t.needIds||[]).map(id=>`<span class="chip" title="${esc(nmap[id]?(nmap[id].topic+'：'+(nmap[id].pain||nmap[id].want)):'找不到這則需求')}">${esc(nmap[id]?nmap[id].topic:id)}${nmap[id]&&nmap[id].plus.length?` +${nmap[id].plus.length}`:''}</span>`).join('')}</div>
        ${t.conflict?`<div class="conflict"><b>待決定：</b>${esc(t.conflict)}</div>`:''}
        ${t.decision?`<div class="decision"><b>決定：</b>${esc(t.decision)}</div>`:''}
        ${edit?`<div><button class="linkbtn" data-tedit="${i}">${t.conflict&&!t.decision?'填寫決定 / 編輯':'編輯'}</button></div><div class="tedit" id="te_${i}" hidden>
          <label class="f"><span>主題名稱</span><input type="text" data-k="title" value="${esc(t.title)}"></label>
          <label class="f"><span>說明</span><textarea data-k="summary" rows="2">${esc(t.summary)}</textarea></label>
          <label class="f"><span>來源需求編號（逗號分隔）</span><input type="text" data-k="needIds" value="${esc((t.needIds||[]).join(', '))}"></label>
          <label class="f"><span>意見衝突（待決定）</span><textarea data-k="conflict" rows="2">${esc(t.conflict)}</textarea></label>
          <label class="f"><span>決定（會帶進規格的「已決定事項」）</span><textarea data-k="decision" rows="2">${esc(t.decision)}</textarea></label>
          <div class="row"><button class="btn sm" data-tdel="${i}">刪除主題</button><button class="btn sm primary" data-tsave="${i}">儲存</button></div>
        </div>`:''}
      </article>`).join(''):`<div class="card"><div class="in"><p class="empty">${edit?'按上方「AI 整理」，AI 會把這一輪的需求歸納成主題。':'管理者整理後，主題會出現在這裡。'}</p></div></div>`}
    </div>
    <section class="card"><h2>本輪需求<span class="sp"></span><span class="who2">${needs.length} 則${unassigned.length&&themes.length?` · ${unassigned.length} 則未歸類`:''}</span></h2>
      <div class="in list">${needs.length?needs.slice().sort((a,b)=>b.plus.length-a.plus.length).map(n=>`<div class="mini ${themeOf(n.id)?'':'un'}"><b>${esc(n.topic)}</b>${n.plus.length?` <span class="who2">+${n.plus.length}</span>`:''}<div class="hint">${esc(n.pain||n.want)}</div>${themeOf(n.id)?'':`<span class="tag">未歸類</span>`}</div>`).join(''):'<p class="empty">這一輪沒有需求。</p>'}</div>
    </section></div>`;
  if(!edit) return;
  const ai=$('aiThemes'); if(ai) ai.onclick=async()=>{
    if(realThemes.length&&ai.dataset.armed!=='1'){ ai.dataset.armed='1'; ai.textContent='再按一次：重新整理（填過的決定會保留）'; return; }
    await aiThemesRun(realThemes.length?'請依目前全部需求重新整理主題，保留已填的決定。':''); };
  const oc=$('openThemeChat'); if(oc) oc.onclick=()=>openChat('themes');
  $('addTheme').onclick=async e=>{ const list=themes.concat([{id:'t'+Date.now().toString(36),title:'新主題',summary:'',needIds:[],conflict:'',decision:''}]);
    const r=await act(e.target,'pageSaveThemes',S.project,list).catch(()=>null); if(r){ S.plan=r; renderProject(); const el=$('te_'+(r.themes.length-1)); if(el){ el.hidden=false; el.querySelector('input').focus(); } } };
  $('tabBody').querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>{ const el=$('te_'+b.dataset.tedit); el.hidden=!el.hidden; });
  $('tabBody').querySelectorAll('[data-tsave]').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.tsave, el=$('te_'+i), t={...themes[i]};
    el.querySelectorAll('[data-k]').forEach(x=>{ t[x.dataset.k]= x.dataset.k==='needIds' ? x.value.split(/[,，\s]+/).filter(Boolean) : x.value; });
    const list=themes.slice(); list[i]=t; const r=await act(b,'pageSaveThemes',S.project,list).catch(()=>null); if(r){ S.plan=r; renderProject(); toast('已儲存'); } });
  $('tabBody').querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='再按一次確定刪除'; return; }
    const r=await act(b,'pageSaveThemes',S.project,themes.filter((_,i)=>i!==+b.dataset.tdel)).catch(()=>null); if(r){ S.plan=r; renderProject(); toast('已刪除'); } });
}

/* ---------- ③ 畫圖及規格 ---------- */
function draftSpec(){ return parseLoose(S.plan.draft||''); }
function openComments(node){ return (S.plan.comments||[]).filter(c=>c.status==='open'&&(node===undefined||c.node===node)); }
function renderSpec(){
  const p=proj(), cur=p.status==='drafting', edit=canEdit('drafting');
  const spec = cur||!S.dev ? draftSpec() : S.dev.spec;
  const base = cur&&S.dev ? S.dev.spec : null, dl = base&&spec&&spec.nodes ? specDiff(base,spec) : null;
  const lastDraft=(S.plan.drafts||[]).slice(-1)[0], nOpen=openComments().length;
  if(!spec||!spec.nodes||!spec.nodes.length){
    $('tabBody').innerHTML=`<div class="card hero"><div class="in">
      <p class="empty">${edit?'還沒有流程圖。AI 會依照主題、決定事項和需求，畫出初版流程與每一步的驗收標準。':'管理者產生流程圖後，會出現在這裡，到時可以點每個步驟提意見。'}</p>
      ${edit?`<div><button class="btn primary" id="aiSpec" ${S.plan.aiReady?'':'disabled'}>AI 畫出初版流程圖</button></div>${S.plan.aiReady?'':keyHelp()}`:''}
    </div></div>`;
    const b=$('aiSpec'); if(b) b.onclick=()=>aiSpecRun();
    return;
  }
  const info=id=>{ const n=spec.nodes.find(x=>x.id===id), c=cur?openComments(id).length:0; return {sub:(TYPE_ZH[n.type]||n.type)+(n.locked&&cur?' · 已鎖定':''), q:c?`${c} 則意見`:''}; };
  const w=lint(spec);
  $('tabBody').innerHTML=`
    ${cur?`<div class="aibar">
      <span class="ver">草稿 v${lastDraft?lastDraft.v:1}</span><span class="hint">${lastDraft?esc(fmt(lastDraft.ts)+' · '+who(lastDraft.by)+'：'+lastDraft.note):''}</span>
      <span class="sp"></span>
      ${edit?`<button class="btn" id="openVers">版本紀錄</button><button class="btn primary" id="openSpecChat" ${S.plan.aiReady?'':'disabled'}>AI 對話整理意見${nOpen?`<span class="badge">${nOpen}</span>`:''}</button>`:''}
    </div>`:''}
    <div class="two">
      <div class="list">
        <section class="card"><h2>流程圖<span class="sp"></span><span class="who2">${spec.nodes.length} 個步驟 · 點選步驟查看或提意見</span></h2><div class="graph" id="specGraph"></div></section>
        ${dl?`<section class="card"><h2>和已上線 v${S.dev.version} 的差異</h2><div class="in">${dl.length?`<ul class="diff">${dl.map(d=>`<li class="${d.k}">${d.k==='add'?'＋ 新增':d.k==='chg'?'～ 修改':'－ 刪除'}　${esc(d.label)}</li>`).join('')}</ul>`:`<p class="hint">和 v${S.dev.version} 完全一樣。</p>`}</div></section>`:''}

function renderNodePanel(spec,cur,edit){

      ${edit?`<div class="row">${c.status==='open'?`<button class="linkbtn" data-cs="${c.id}" data-to="ignored">不採納</button><button class="linkbtn" data-cs="${c.id}" data-to="resolved">標為已處理</button>`:`<button class="linkbtn" data-cs="${c.id}" data-to="open">重新打開</button>`}</div>`:''}</div>`).join('')}</div>`:`<p class="empty">還沒有意見。</p>`}

      ${n.description?`<div>${esc(n.description)}</div>`:''}

      ${n.acceptance&&n.acceptance.length?`<div class="sec"><h3>驗收標準</h3><ul class="acc">${n.acceptance.map(a=>`<li><span class="aid">${esc(a.id)}</span><span>${esc(a.text)}</span></li>`).join('')}</ul></div>`:''}
      ${edit?`<div class="row left"><button class="btn sm" id="nEdit">手動修改</button><button class="btn sm" id="nLock">${n.locked?'解除鎖定':'鎖定（AI 不改）'}</button><button class="btn sm" id="nAdd">在後面新增步驟</button><button class="btn sm" id="nDel">刪除</button></div>
      <form class="tedit" id="nForm" hidden>
        <label class="f"><span>名稱</span><input type="text" id="nf_label" value="${esc(n.label)}"></label>
        <label class="f"><span>類型</span><select id="nf_type">${Object.entries(TYPE_ZH).map(([k,v])=>`<option value="${k}" ${k===n.type?'selected':''}>${v}</option>`).join('')}</select></label>
        <label class="f"><span>說明</span><textarea id="nf_desc" rows="2">${esc(n.description||'')}</textarea></label>
        <label class="f"><span>需要的資料（逗號分隔）</span><input type="text" id="nf_in" value="${esc((n.inputs||[]).join(', '))}"></label>
        <label class="f"><span>產出的資料（逗號分隔）</span><input type="text" id="nf_out" value="${esc((n.outputs||[]).join(', '))}"></label>
        <label class="f"><span>驗收標準（一行一條）</span><textarea id="nf_acc" rows="4">${esc((n.acceptance||[]).map(a=>a.text).join('\n'))}</textarea></label>
        <div class="row"><button type="button" class="btn sm" id="nfCancel">取消</button><button class="btn sm primary" id="nfSave">儲存（會自動鎖定）</button></div>

  }
  const send=$('cmSend'); if(send){ const inp=$('cmIn');
    const go=async()=>{ if(!inp.value.trim()) return; const r=await act(send,'pageAddComment',S.project,n?n.id:'',inp.value).catch(()=>null); if(r){ S.plan=r; renderProject(); toast('意見已送出'); } };

  $('nForm').onsubmit=async e=>{ e.preventDefault();
    const patch={label:$('nf_label').value.trim()||n.label,type:$('nf_type').value,description:$('nf_desc').value.trim(),inputs:split($('nf_in').value),outputs:split($('nf_out').value),
      acceptance:$('nf_acc').value.split('\n').map(x=>x.trim()).filter(Boolean).map((t,i)=>({id:'a'+(i+1),text:t}))};
    const r=await act($('nfSave'),'pageEditNode',S.project,n.id,patch).catch(()=>null); if(r){ S.plan=r; renderProject(); toast('已儲存，這一步已鎖定'); } };
  $('nLock').onclick=async e=>{ const r=await act(e.target,'pageEditNode',S.project,n.id,{locked:!n.locked}).catch(()=>null); if(r){ S.plan=r; renderProject(); } };
  $('nAdd').onclick=async e=>{ const r=await act(e.target,'pageEditNode',S.project,'',{newNode:{label:'新步驟',type:'tool'},after:n.id}).catch(()=>null);
    if(r){ S.plan=r; const d=draftSpec(); S.sel=d.nodes[d.nodes.length-1].id; renderProject(); $('nForm')&&($('nForm').hidden=false); } };
  $('nDel').onclick=async e=>{ const b=e.target; if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='再按一次確定刪除'; return; }
    const r=await act(b,'pageEditNode',S.project,n.id,null).catch(()=>null); if(r){ S.plan=r; S.sel=null; renderProject(); toast('已刪除'); } };
}

  const stage=$('modal').dataset.stage, isSpec=stage==='spec';
  const msgs=(S.plan.chats||[]).filter(c=>c.stage===stage);
  const nOpen=isSpec?openComments().length:0;
  const chips=isSpec?['把同事的意見整理進去','檢查驗收標準是否具體、可測試','流程太複雜，幫我簡化','補上例外情況的處理']:['重新整理全部需求','合併意思相近的主題','把衝突的意見拆得更清楚'];

    </div>

    </div>`;

/* ---------- 流程圖（共用） ---------- */
function layout(spec){
  const ids=spec.nodes.map(n=>n.id), layer={}; ids.forEach(i=>layer[i]=0);
  for(let k=0;k<ids.length;k++) (spec.edges||[]).forEach(e=>{ if(layer[e.from]!=null&&layer[e.to]!=null&&layer[e.to]<layer[e.from]+1) layer[e.to]=layer[e.from]+1; });
  const cols={}; spec.nodes.forEach(n=>{ (cols[layer[n.id]]=cols[layer[n.id]]||[]).push(n.id); });
  const W=150,H=58,GX=56,GY=34,PX=16,PY=26,pos={};
  const maxRows=Math.max(...Object.values(cols).map(c=>c.length));
  Object.entries(cols).forEach(([l,c])=>{ const off=(maxRows-c.length)*(H+GY)/2; c.forEach((id,i)=>pos[id]={x:PX+l*(W+GX),y:PY+off+i*(H+GY),w:W,h:H}); });
  return {pos,cw:PX*2+Object.keys(cols).length*(W+GX)-GX,ch:PY+16+maxRows*(H+GY)-GY};
}
/* info(id) → {c:狀態色 token, zh:狀態文字} 或 {sub:灰字說明}；q：右下角提示 */
function graphSvg(spec, info, selId){
  const {pos,cw,ch}=layout(spec);
  let s=`<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;min-width:${Math.round(cw*0.72)}px;max-width:${cw}px;height:auto" role="img" aria-label="流程圖"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--muted)"/></marker></defs>`;
  (spec.edges||[]).forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x-2, y2=b.y+b.h/2, dx=Math.max(30,(x2-x1)/2);
    s+=`<path class="edge" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" marker-end="url(#ar)"/>`;
    if(e.label) s+=`<text class="etxt" x="${b.x+2}" y="${b.y-7}">${esc(e.label)} ▸</text>`; });
  spec.nodes.forEach(n=>{ const p=pos[n.id], i=info(n.id)||{};
    s+=`<g class="node${selId===n.id?' sel':''}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}">
      <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"/>
      <rect x="${p.x}" y="${p.y}" width="6" height="${p.h}" rx="3" style="fill:var(${i.c||'--line'})"/>
      <text class="lb" x="${p.x+16}" y="${p.y+24}">${esc(n.label||n.id)}</text>
      ${i.c?`<circle cx="${p.x+20}" cy="${p.y+41}" r="4" style="fill:var(${i.c})"/><text class="st" x="${p.x+30}" y="${p.y+45}" style="fill:var(${i.c})">${esc(i.zh)}</text>`
        :`<text class="st" x="${p.x+16}" y="${p.y+45}" style="fill:var(--muted)">${esc(i.sub||TYPE_ZH[n.type]||n.type)}</text>`}
      ${i.q?`<text class="q" x="${p.x+p.w-10}" y="${p.y+45}" text-anchor="end">${esc(i.q)}</text>`:''}
    </g>`; });
  return s+'</svg>';
}

function specDiff(a,b){
  const key=n=>JSON.stringify(Object.assign({},n,{x:undefined,y:undefined}));
  const am=Object.fromEntries((a.nodes||[]).map(n=>[n.id,n])), bm=Object.fromEntries((b.nodes||[]).map(n=>[n.id,n])), out=[];
  (b.nodes||[]).forEach(n=>{ if(!am[n.id]) out.push({k:'add',id:n.id,label:n.label||n.id}); else if(key(am[n.id])!==key(n)) out.push({k:'chg',id:n.id,label:n.label||n.id}); });
  (a.nodes||[]).forEach(n=>{ if(!bm[n.id]) out.push({k:'del',id:n.id,label:n.label||n.id}); });
  return out;
}
function lint(spec){
  const w=[], ids=new Set((spec.nodes||[]).map(n=>n.id)), edges=spec.edges||[];
  (spec.nodes||[]).forEach(n=>{ if(!n.id) w.push('有節點沒有 id'); if(!TYPE_ZH[n.type]) w.push(`${n.id} 的類型「${n.type}」不在六種類型裡`); });
  edges.forEach(e=>{ if(!ids.has(e.from)||!ids.has(e.to)) w.push(`連線 ${e.from} → ${e.to} 指到不存在的節點`); });
  (spec.nodes||[]).forEach(n=>{
    if(n.type!=='input'&&!(n.acceptance&&n.acceptance.length)) w.push(`${n.label||n.id} 沒有驗收標準`);
    if(!(n.inputs&&n.inputs.length)) return;
    const anc=new Set(), st=[n.id]; while(st.length){ const c=st.pop(); edges.forEach(e=>{ if(e.to===c&&!anc.has(e.from)){ anc.add(e.from); st.push(e.from); } }); }
    const avail=new Set((spec.nodes||[]).filter(x=>anc.has(x.id)).flatMap(x=>x.outputs||[]));
    n.inputs.forEach(i=>{ if(anc.size&&!avail.has(i)) w.push(`${n.label||n.id} 需要「${i}」，但前面的節點都沒有產出它`); });
  });
  (spec.openQuestions||[]).forEach(q=>w.push('尚未決定：'+q));
  return w;
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('modal').hidden) closeModal(); });
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function typing(){ if(!$('modal').hidden||!$('busy').hidden) return true; const a=document.activeElement; return a&&/INPUT|TEXTAREA/.test(a.tagName) || [...document.querySelectorAll('textarea,input[type=text]')].some(x=>x.value.trim()); }
$('homeBtn').onclick=async()=>{ if(google.script.history) google.script.history.replace(null,{}); await loadHome(); renderHome(); };
$('refresh').onclick=async e=>{ e.target.disabled=true; try{ await loadHome(); if(S.project) await refreshProject(); else renderHome(); banner(''); }catch(err){ banner((err&&err.message)||'讀取失敗'); } e.target.disabled=false; };
(async()=>{
  try{
    await loadHome();
    const go=id=>{ if(id&&S.projects.some(p=>p.project===id)) return openProject(id); renderHome(); return Promise.resolve(); };
    if(google.script.url) google.script.url.getLocation(loc=>go(loc.parameter&&loc.parameter.project).catch(e=>banner(e.message)));
    else renderHome();
    setInterval(async()=>{ if(document.visibilityState!=='visible'||typing()||!S.project) return; try{ await loadHome(); await refreshProject(); }catch(e){} },60000);
  }catch(e){ banner((e&&e.message)||'讀取失敗'); $('view').innerHTML=''; }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：頁首 → 專案列（名稱＋階段進度）→ 分頁（需求／整理／規格／開發）；手機改單欄
   色彩：石墨灰的冷調中性色＋琥珀橘重點色（暖色的科技感） */
:root{
  --bg:#f3f2ef; --panel:#ffffff; --ink:#1e1d1b; --muted:#6a655d; --line:#dedad2; --soft:#f8f7f4;
  --accent:#c2540a; --accent-ink:#ffffff; --accent-soft:#fbeadb;
  --s-todo:#8a948f; --s-working:#2f6fb8; --s-done:#2e8b57; --s-blocked:#c0392b; --s-review:#c28a00;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --panel:#1a1d22; --ink:#ebe7e1; --muted:#9c968c; --line:#2b2f36; --soft:#16191d;
  --accent:#ff9447; --accent-ink:#1a1209; --accent-soft:#3a2617;
  --s-todo:#7d8883; --s-working:#6ea6e6; --s-done:#5cc28a; --s-blocked:#ef7a6d; --s-review:#e6b84a;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans)}
button,textarea,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
header .brand{font-weight:700;font-size:15px;letter-spacing:.04em}
header .sp{flex:1}
.who{font-size:12px;color:var(--muted)}
select,.btn,input[type=text],input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--soft);resize:vertical}
input[type=text]{width:100%}
label.f{display:grid;gap:4px;font-size:13px}
label.f>span{color:var(--muted);font-size:12.5px}

.pbar{display:grid;gap:8px}
.pbar h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.purpose{color:var(--muted);max-width:70ch;margin:0}
.meta-line{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ver{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.steps{display:flex;gap:0;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:2px 0}
.step .no{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono)}
.step.done .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.cur{color:var(--ink);font-weight:700}
.step.cur .no{border-color:var(--accent);color:var(--accent)}
.step+.step::before{content:"";width:22px;height:1.5px;background:var(--line);margin:0 8px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .c{font-family:var(--mono);font-size:11.5px;margin-left:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.card h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card .in{padding:14px;display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.two.flip{grid-template-columns:360px minmax(0,1fr)}
.req{font-style:normal;font-size:11px;color:var(--accent);margin-left:4px}
details.older{border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
details.older summary{cursor:pointer;color:var(--muted);font-size:13px}
.diff{display:grid;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
.diff .add{color:var(--s-done)}.diff .chg{color:var(--s-working)}.diff .del{color:var(--s-blocked)}
.empty{color:var(--muted);font-size:13px;margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* 需求卡片 */
.need{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;display:grid;gap:8px}
.ntopic{font-weight:700;font-size:15px;line-height:1.4}
.roundhd{font-size:12.5px;color:var(--muted);letter-spacing:.06em;font-weight:700;margin:6px 0 0}
.need .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.need .hd b{color:var(--ink);font-weight:500}
.need .hd .nid{font-family:var(--mono);font-size:11px}
.need dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.need dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.need dd{margin:0;min-width:0;word-break:break-word;white-space:pre-wrap}
.need .ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plus{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:1px 10px;font-size:12.5px;cursor:pointer}
.plus.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.cmts{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.cmt{font-size:13px}
.cmt .by{color:var(--muted);font-size:12px;margin-right:6px}
.crow{display:flex;gap:6px}
.crow input{flex:1}
.ttag{font-size:11.5px;border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--accent)}
.list{display:grid;gap:10px}

/* 主題 */
.theme{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;background:var(--panel)}
.theme .tt{font-weight:700;font-size:15px}
.theme .src{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--soft)}
.conflict{border-left:3px solid var(--s-review);background:var(--soft);padding:6px 10px;font-size:13px;border-radius:0 6px 6px 0}
.conflict b{color:var(--s-review)}
.decision{border-left:3px solid var(--s-done);background:var(--soft);padding:6px 10px;font-size:13px;border-radius:0 6px 6px 0}
.tedit{display:grid;gap:8px}
.tedit .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* 規格 */
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:360px;line-height:1.5;white-space:pre;overflow:auto}
.warn{font-size:13px;display:grid;gap:4px;margin:0;padding-left:18px;color:var(--s-review)}
.ok{font-size:13px;color:var(--s-done);margin:0}
.nlist{display:grid;gap:8px}
.nitem{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.nitem .h{font-weight:500}
.nitem .h .id{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.nitem ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}

/* 流程圖（共用） */
.graph{overflow:auto;padding:12px}
.graph svg{display:block}
.graph .edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.graph .etxt{fill:var(--muted);font-size:12.5px;font-family:var(--sans)}
.graph .node rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1}
.graph .node{cursor:pointer}
.graph .node:hover rect.box{stroke:var(--accent)}
.graph .node.sel rect.box{stroke:var(--accent);stroke-width:2.5}
.graph .node .lb{fill:var(--ink);font-size:15px;font-weight:500;font-family:var(--sans)}
.graph .node .st{font-size:12.5px;font-family:var(--sans)}
.graph .node .q{fill:var(--s-review);font-size:12px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* 開發 */
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.pill b{font-variant-numeric:tabular-nums}
.detail{padding:14px;display:grid;gap:12px;align-content:start}
.detail .ttl{font-size:16px;font-weight:700;margin:0}
.detail .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.acc{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.acc li{display:flex;gap:8px;font-size:13px}
.acc .aid{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.latest{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.arts{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.arts a{color:var(--accent);word-break:break-all}
.arts .path{font-family:var(--mono);font-size:12px;word-break:break-all}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.qs,.tl{padding:6px 14px 14px;display:grid}
.q{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.q:last-child{border-bottom:none}
.q .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.q .text{font-weight:500}
.q textarea{min-height:60px}
.q .row{display:flex;justify-content:flex-end}
.q .ans{font-size:13px;background:var(--soft);border-radius:6px;padding:6px 10px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .body{min-width:0;font-size:13px}
.ev .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .nd{font-weight:500}
.who2{font-size:11.5px;color:var(--muted)}

/* 首頁專案清單 */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard .t{font-weight:700;font-size:15px}
.pcard .ph{font-size:12px;color:var(--accent);font-weight:500}

.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--s-blocked);border-radius:6px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:9}
.loading{color:var(--muted);font-size:13px}

@media (max-width:900px){ .two,.two.flip,.bottom{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">使用者共創</span>
    <button class="btn sm" id="homeBtn" hidden>所有專案</button>
    <span class="sp"></span>
    <button class="btn sm" id="refresh">重新整理</button>
    <span class="who" id="who"></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="view"><p class="loading">讀取中…</p></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= 共用 ================= */
const PH = {collecting:'收集需求', organizing:'整理需求', drafting:'寫規格', developing:'開發中'};
const PH_ORDER = ['collecting','organizing','drafting','developing'];
const ST = {
  todo:{zh:'未開始',c:'--s-todo'}, working:{zh:'進行中',c:'--s-working'}, done:{zh:'完成',c:'--s-done'},
  blocked:{zh:'卡住',c:'--s-blocked'}, needs_review:{zh:'待確認',c:'--s-review'}
};
const TYPE_ZH = {input:'輸入',llm:'AI 判斷／生成',retrieve:'查資料',condition:'分流',tool:'程式處理',output:'輸出'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = ts => { const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const who = a => String(a||'').replace(/^agent:/,'AI · ').replace(/^agent$/,'AI').replace(/@.*/,'');
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }
function banner(m){ $('banner').textContent=m; $('banner').hidden=!m; }
function run(fn,...args){ return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)); }
async function act(btn, fn, ...args){
  const label = btn && btn.textContent; if(btn){ btn.disabled=true; btn.textContent='處理中…'; }
  try { return await run(fn,...args); }
  catch(e){ toast((e&&e.message)||'發生錯誤，請再試一次'); throw e; }
  finally { if(btn){ btn.disabled=false; btn.textContent=label; } }
}
function copyText(text){
  const done=()=>toast('已複製，貼到 Claude 或 Gemini 的對話裡');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('無法自動複製，請手動選取');} ta.remove(); }
}
function parseLoose(text){
  let t=String(text||'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence) t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  const cands=[t]; if(a>=0&&b>a) cands.push(t.slice(a,b+1));
  // 手機、輸入法常把 " 換成彎引號：先試只換結構位置的，再試全部換掉
  const smart=x=>x.replace(/([{\[,:]\s*)[“”„‟″]/g,'$1"').replace(/[“”„‟″](\s*[:,}\]])/g,'"$1');
  const all=x=>x.replace(/[“”„‟″]/g,'"').replace(/[‘’]/g,"'");
  for(const c of cands) for(const f of [x=>x, smart, all]){ try{ return JSON.parse(f(c)); }catch(e){} }
  return null;
}

let S = { user:'', isOwner:false, projects:[], project:null, tab:null, plan:null, dev:null, sel:null, tlFilter:null };

/* ================= 首頁：專案清單 ================= */
async function loadHome(){
  const r = await run('pageProjects');
  S.user=r.user; S.isOwner=r.isOwner; S.projects=r.projects;
  $('who').textContent=r.user+(r.isOwner?'（管理者）':'');
  return r;
}
function renderHome(){
  S.project=null; $('homeBtn').hidden=true;
  const order=p=>PH_ORDER.indexOf(p.status);
  const list=S.projects.slice().sort((a,b)=>order(a)-order(b));
  $('view').innerHTML=`
    <div class="pbar"><h1>所有專案</h1><p class="purpose">點選專案，提出需求、查看整理結果和開發進度。</p></div>
    ${S.isOwner?`<section class="card" style="margin-top:14px"><h2>開新專案</h2><form class="in" id="newProj">
      <div class="two" style="grid-template-columns:1fr 1fr">
        <label class="f"><span>專案名稱</span><input type="text" id="np_title" placeholder="例：請假單自動化" required></label>
        <label class="f"><span>專案代號（英文小寫、數字、-）</span><input type="text" id="np_id" placeholder="例：leave-form" required></label>
      </div>
      <label class="f"><span>想解決什麼（給同事看的一兩句話）</span><textarea id="np_purpose" rows="2" placeholder="例：請假流程要跑三個人簽核，常常卡住，想看看能不能簡化。"></textarea></label>
      <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
        <label class="f"><span>需求收集截止日（選填）</span><input type="date" id="np_due"></label>
        <span style="flex:1"></span><button class="btn primary" id="np_btn">建立並開始收集需求</button>
      </div></form></section>`:''}
    <div class="plist" style="margin-top:14px">${list.length?list.map(p=>`
      <button class="pcard" data-p="${esc(p.project)}">
        <span class="ph">${(p.round||1)>1?`第 ${p.round} 輪 · `:''}${PH[p.status]||p.status}${p.version?` · 已上線 v${p.version}`:''}</span>
        <span class="t">${esc(p.title||p.project)}</span>
        ${p.purpose?`<span class="hint">${esc(p.purpose)}</span>`:''}
        <span class="who2">${p.needs?`${p.needs} 則需求`:''}${p.due?`　截止 ${esc(String(p.due).slice(0,10))}`:''}</span>
      </button>`).join(''):`<p class="empty">還沒有任何專案。${S.isOwner?'用上方表單開第一個。':'等管理者開專案後，這裡會出現。'}</p>`}</div>`;
  $('view').querySelectorAll('.pcard').forEach(b=>b.onclick=()=>openProject(b.dataset.p));
  const f=$('newProj'); if(f){
    f.onsubmit=async e=>{ e.preventDefault();
      const r=await act($('np_btn'),'pageCreateProject',{project:$('np_id').value,title:$('np_title').value,purpose:$('np_purpose').value,due:$('np_due').value}).catch(()=>null);
      if(r){ toast('專案已建立'); await loadHome(); openProject(r.project); } };
  }
}

/* ================= 專案頁 ================= */
function proj(){ return S.projects.find(p=>p.project===S.project)||{}; }
async function openProject(id, tab){
  S.project=id; S.sel=null; S.tlFilter=null; $('homeBtn').hidden=false;
  if(google.script.history) google.script.history.replace(null,{project:id});
  const p=proj();
  S.tab = tab || ({collecting:'needs',organizing:'themes',drafting:'spec',developing:'dev'}[p.status]||'needs');
  await refreshProject();
}
async function refreshProject(){
  const p=proj();
  const jobs=[];
  if(!p.external) jobs.push(run('pagePlanning',S.project).then(r=>S.plan=r));
  else S.plan={needs:[],themes:[],draft:'',info:null,round:1};
  if(p.version>0) jobs.push(run('pageData',S.project).then(r=>S.dev=r));
  else S.dev=null;
  await Promise.all(jobs);
  renderProject();
}
function renderProject(){
  const p=proj(), cur=PH_ORDER.indexOf(p.status);
  const tabs=[['needs','需求',roundNeeds(curRound()).length],['themes','整理',S.plan.themes.length],['spec','規格',''],['dev','開發','']];
  $('view').innerHTML=`
    <div class="pbar">
      <h1>${esc(p.title||p.project)}</h1>
      ${p.purpose?`<p class="purpose">${esc(p.purpose)}</p>`:''}
      <div class="meta-line">
        ${((S.plan&&S.plan.round)||p.round||1)>1?`<span class="ver">第 ${(S.plan&&S.plan.round)||p.round} 輪</span>`:''}

3. 每個節點寫 inputs、outputs（英文小寫欄位名稱），下游需要的欄位，上游一定要有節點輸出

{"title":"…","purpose":"…","nodes":[{"id":"英文小寫_底線","type":"llm","label":"…","description":"…","inputs":["…"],"outputs":["…"],"acceptance":[{"id":"a1","text":"…"}]}],"edges":[{"from":"…","to":"…","label":"可省略"}],"decisions":["…"],"openQuestions":["…"]}`;

function specDiff(a,b){
  const key=n=>JSON.stringify(Object.assign({},n,{x:undefined,y:undefined}));
  const am=Object.fromEntries((a.nodes||[]).map(n=>[n.id,n])), bm=Object.fromEntries((b.nodes||[]).map(n=>[n.id,n])), out=[];
  (b.nodes||[]).forEach(n=>{ if(!am[n.id]) out.push({k:'add',id:n.id,label:n.label||n.id}); else if(key(am[n.id])!==key(n)) out.push({k:'chg',id:n.id,label:n.label||n.id}); });
  (a.nodes||[]).forEach(n=>{ if(!bm[n.id]) out.push({k:'del',id:n.id,label:n.label||n.id}); });
  return out;
}
function lint(spec){
  const w=[], ids=new Set((spec.nodes||[]).map(n=>n.id)), edges=spec.edges||[];
  (spec.nodes||[]).forEach(n=>{ if(!n.id) w.push('有節點沒有 id'); if(!TYPE_ZH[n.type]) w.push(`${n.id} 的類型「${n.type}」不在六種類型裡`); });
  edges.forEach(e=>{ if(!ids.has(e.from)||!ids.has(e.to)) w.push(`連線 ${e.from} → ${e.to} 指到不存在的節點`); });
  (spec.nodes||[]).forEach(n=>{
    if(n.type!=='input'&&!(n.acceptance&&n.acceptance.length)) w.push(`${n.label||n.id} 沒有驗收標準`);
    if(!(n.inputs&&n.inputs.length)) return;
    const anc=new Set(), st=[n.id]; while(st.length){ const c=st.pop(); edges.forEach(e=>{ if(e.to===c&&!anc.has(e.from)){ anc.add(e.from); st.push(e.from); } }); }
    const avail=new Set((spec.nodes||[]).filter(x=>anc.has(x.id)).flatMap(x=>x.outputs||[]));
    n.inputs.forEach(i=>{ if(anc.size&&!avail.has(i)) w.push(`${n.label||n.id} 需要「${i}」，但前面的節點都沒有產出它`); });
  });
  (spec.openQuestions||[]).forEach(q=>w.push('尚未決定：'+q));
  return w;
}
function renderSpec(){
  const owner=S.isOwner, p=proj();
  const published=p.status==='developing';
  const text=published&&S.dev?JSON.stringify(S.dev.spec,null,2):(S.plan.draft||''), spec=parseLoose(text);
  const base=!published&&S.dev?S.dev.spec:null, dl=base&&spec&&spec.nodes?specDiff(base,spec):null;
  $('tabBody').innerHTML=`<div class="two">
    <div class="list">
      <section class="card"><h2>流程預覽<span class="sp"></span>${spec?`<span class="who2">${(spec.nodes||[]).length} 個節點</span>`:''}</h2>
        ${spec&&spec.nodes?`<div class="graph" id="specGraph"></div>`:`<div class="in"><p class="empty">${text?'草稿不是有效的 JSON。':'還沒有規格草稿。'}${owner&&!published?'用右邊的步驟產生一版。':''}</p></div>`}
      </section>
      ${dl?`<section class="card"><h2>和已上線 v${S.dev.version} 的差異</h2><div class="in">${dl.length?`<ul class="diff">${dl.map(d=>`<li class="${d.k}">${d.k==='add'?'＋ 新增':d.k==='chg'?'～ 修改':'－ 刪除'}　${esc(d.label)} <span class="who2">${esc(d.id)}</span></li>`).join('')}</ul><p class="hint">發布後 AI Agent 只需要處理這些節點。</p>`:`<p class="hint">目前草稿和 v${S.dev.version} 完全一樣。</p>`}</div></section>`:''}
      ${spec&&spec.nodes?`<section class="card"><h2>檢查結果</h2><div class="in">${(()=>{ const w=lint(spec); return w.length?`<ul class="warn">${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="ok">✓ 節點、連線、輸入輸出、驗收標準都沒有問題</p>`; })()}</div></section>
      <section class="card"><h2>節點與驗收標準</h2><div class="in nlist">${spec.nodes.map(n=>`<div class="nitem"><div class="h">${esc(n.label||n.id)}<span class="id">${esc(n.id)} · ${TYPE_ZH[n.type]||esc(n.type)}</span></div>${n.description?`<div>${esc(n.description)}</div>`:''}${n.acceptance&&n.acceptance.length?`<ul>${n.acceptance.map(a=>`<li>${esc(a.text)}</li>`).join('')}</ul>`:''}</div>`).join('')}
        ${spec.decisions&&spec.decisions.length?`<div class="decision"><b>已決定：</b>${spec.decisions.map(esc).join('；')}</div>`:''}</div></section>`:''}
    </div>
    <section class="card"><h2>${owner&&!published?'產生與修改規格':'說明'}</h2><div class="in">
      ${owner&&!published?`
        ${base?`<p class="hint">草稿已經帶入目前上線的 v${S.dev.version}，提示詞會請 AI 在這個基礎上修改。</p>`:''}
        <p class="hint">1. 複製提示詞（已包含主題、決定事項和原始需求）<br>2. 貼到 Claude 或 Gemini 的對話<br>3. 把回覆貼進下方，按「儲存草稿」</p>
        <button class="btn" id="copySpec">複製提示詞</button>
        <label class="f"><span>規格草稿（JSON，可以直接修改）</span><textarea class="code" id="draftIn" spellcheck="false">${esc(text)}</textarea></label>
        <button class="btn" id="saveDraft">儲存草稿</button>
        <div id="pubBox">${spec&&spec.nodes?`<button class="btn primary" id="pubBtn">定稿並發布 v${(p.version||0)+1}</button>`:''}</div>
      `:published?`<p class="hint">這是目前上線的 v${p.version} 規格，AI Agent 依這份規格開發中，進度請看「開發」分頁。有新需求時，管理者可以按上方「開始第 ${(p.round||1)+1} 輪需求」。</p>`
      :`<p class="hint">管理者會依整理好的主題產生規格。這裡可以看到流程和每個步驟的驗收標準，有意見請到「需求」分頁留言。</p>`}
    </div></section>
  </div>`;
  if(spec&&spec.nodes) $('specGraph').innerHTML=graphSvg(spec,()=>null,null)+legendHtml(false);
  if(!(owner&&!published)) return;
  $('copySpec').onclick=()=>copyText(specPrompt());
  $('saveDraft').onclick=async e=>{
    const obj=parseLoose($('draftIn').value);
    if(obj&&Array.isArray(obj.themes)){ toast('這段是「整理」的主題結果，請貼到「整理」分頁'); return; }
    if(!obj||!Array.isArray(obj.nodes)){ toast('看不懂這段內容，請確認貼上的是 AI 回覆的規格 JSON（包含 nodes）'); return; }
    const r=await act(e.target,'pageSaveDraft',S.project,JSON.stringify(obj)).catch(()=>null); if(r){ S.plan=r; renderProject(); toast('草稿已儲存'); }
  };
  const pb=$('pubBtn'); if(pb) pb.onclick=()=>{
    const w=lint(spec);
    $('pubBox').innerHTML=`<div class="confirm"><b>確定要定稿嗎？</b><span class="hint">定稿後 AI Agent 會依這份規格${base?'更新，只重做有變動的節點':'開始開發'}，專案進入「開發中」。</span>
      ${w.length?`<span class="hint" style="color:var(--s-review)">檢查結果還有 ${w.length} 個提醒，建議先處理。</span>`:''}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="pubNo">取消</button><button class="btn primary" id="pubYes">確定發布</button></div></div>`;
    $('pubNo').onclick=()=>renderProject();
    $('pubYes').onclick=async e=>{ const r=await act(e.target,'pagePublish',S.project).catch(()=>null); if(!r) return;
      toast(`已發布 v${r.version}`); await loadHome(); openProject(S.project,'dev'); };
  };
}

/* ---------- 流程圖（共用） ---------- */
function layout(spec){
  const ids=spec.nodes.map(n=>n.id), layer={}; ids.forEach(i=>layer[i]=0);
  for(let k=0;k<ids.length;k++) (spec.edges||[]).forEach(e=>{ if(layer[e.from]!=null&&layer[e.to]!=null&&layer[e.to]<layer[e.from]+1) layer[e.to]=layer[e.from]+1; });
  const cols={}; spec.nodes.forEach(n=>{ (cols[layer[n.id]]=cols[layer[n.id]]||[]).push(n.id); });
  const W=150,H=58,GX=56,GY=34,PX=16,PY=26,pos={};
  const maxRows=Math.max(...Object.values(cols).map(c=>c.length));
  Object.entries(cols).forEach(([l,c])=>{ const off=(maxRows-c.length)*(H+GY)/2; c.forEach((id,i)=>pos[id]={x:PX+l*(W+GX),y:PY+off+i*(H+GY),w:W,h:H}); });
  return {pos,cw:PX*2+Object.keys(cols).length*(W+GX)-GX,ch:PY+16+maxRows*(H+GY)-GY};
}
function graphSvg(spec, statusOf, selId){
  const {pos,cw,ch}=layout(spec);
  let s=`<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;min-width:${Math.round(cw*0.72)}px;max-width:${cw}px;height:auto" role="img" aria-label="流程圖"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--muted)"/></marker></defs>`;
  (spec.edges||[]).forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x-2, y2=b.y+b.h/2, dx=Math.max(30,(x2-x1)/2);
    s+=`<path class="edge" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" marker-end="url(#ar)"/>`;
    if(e.label) s+=`<text class="etxt" x="${b.x+2}" y="${b.y-7}">${esc(e.label)} ▸</text>`; });
  spec.nodes.forEach(n=>{ const p=pos[n.id], info=statusOf(n.id);
    const c=info?info.c:'--accent', label=info?info.zh:(TYPE_ZH[n.type]||n.type);
    s+=`<g class="node${selId===n.id?' sel':''}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}，${label}">
      <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"/>
      <rect x="${p.x}" y="${p.y}" width="6" height="${p.h}" rx="3" style="fill:var(${info?c:'--line'})"/>
      <text class="lb" x="${p.x+16}" y="${p.y+24}">${esc(n.label||n.id)}</text>
      ${info?`<circle cx="${p.x+20}" cy="${p.y+41}" r="4" style="fill:var(${c})"/><text class="st" x="${p.x+30}" y="${p.y+45}" style="fill:var(${c})">${label}</text>`
        :`<text class="st" x="${p.x+16}" y="${p.y+45}" style="fill:var(--muted)">${esc(label)}</text>`}
      ${info&&info.q?`<text class="q" x="${p.x+p.w-10}" y="${p.y+45}" text-anchor="end">${info.q} 個提問</text>`:''}
    </g>`; });
  return s+'</svg>';
}
function legendHtml(withStatus){ return withStatus?`<div class="legend">${Object.values(ST).map(v=>`<span><i class="dot" style="background:var(${v.c})"></i>${v.zh}</span>`).join('')}</div>`:''; }

/* ---------- 開發追蹤 ---------- */
function nodeEv(id){ const e=S.dev.events.filter(x=>x.node===id); return e.length?e[e.length-1]:null; }
function openQ(id){ return S.dev.questions.filter(q=>q.status==='open'&&(!id||q.node===id)); }
function nodeInfo(id){ const ev=nodeEv(id), st=ST[(ev&&ev.status)||'todo']||ST.todo; return {...st,q:openQ(id).length}; }
function artHtml(list){ if(!list||!list.length) return ''; return `<ul class="arts">${list.map(a=>a.url?`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name||a.path||a.url)}</a></li>`:`<li><span class="path">${esc(a.path||a.name||'')}</span></li>`).join('')}</ul>`; }
function renderDev(){
  if(!S.dev){ $('tabBody').innerHTML=`<div class="card"><div class="in"><p class="empty">規格定稿發布後，AI Agent 的開發進度會出現在這裡。</p></div></div>`; return; }
  const d=S.dev, spec=d.spec;
  if(!S.sel){ const f=spec.nodes.find(n=>['blocked','needs_review','working'].includes((nodeEv(n.id)||{}).status)); S.sel=f?f.id:null; }
  const counts={}; spec.nodes.forEach(n=>{ const s=(nodeEv(n.id)||{}).status||'todo'; counts[s]=(counts[s]||0)+1; });
  $('tabBody').innerHTML=`
    <div class="summary"><span class="pill">完成 <b>${counts.done||0} / ${spec.nodes.length}</b></span>
      ${['working','blocked','needs_review'].filter(k=>counts[k]).map(k=>`<span class="pill"><i class="dot" style="background:var(${ST[k].c})"></i>${ST[k].zh} <b>${counts[k]}</b></span>`).join('')}
      ${openQ().length?`<span class="pill"><i class="dot" style="background:var(--s-review)"></i>待回覆提問 <b>${openQ().length}</b></span>`:''}</div>
    <div class="two" style="margin-top:14px">
      <section class="card"><h2>流程</h2><div class="graph" id="devGraph"></div>${legendHtml(true)}</section>
      <section class="card"><h2>節點詳情</h2><div class="detail" id="detail"></div></section>
    </div>
    <div class="bottom" style="margin-top:14px">
      <section class="card"><h2>待回覆 ${openQ().length?`<span class="c">(${openQ().length})</span>`:''}</h2><div class="qs" id="qs"></div></section>
      <section class="card"><h2>開發紀錄 <button class="linkbtn" id="tlAll" hidden>顯示全部</button></h2><div class="tl" id="tl"></div></section>
    </div>`;
  const g=$('devGraph'); g.innerHTML=graphSvg(spec,nodeInfo,S.sel);
  g.onclick=e=>{ const n=e.target.closest('.node'); if(!n) return; S.sel=n.dataset.id; S.tlFilter=null; g.innerHTML=graphSvg(spec,nodeInfo,S.sel); renderDetail(); renderTimeline(); };
  g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ const n=e.target.closest('.node'); if(n){ e.preventDefault(); n.dispatchEvent(new MouseEvent('click',{bubbles:true})); } } };
  $('tlAll').onclick=()=>{ S.tlFilter=null; renderTimeline(); };
  renderDetail(); renderQuestions(); renderTimeline();
}
function renderDetail(){
  const box=$('detail'), spec=S.dev.spec, n=spec.nodes.find(x=>x.id===S.sel);
  if(!n){ box.innerHTML=`<p class="empty">點選流程圖上的節點，查看說明、驗收標準和開發進度。</p>`; return; }
  const ev=nodeEv(n.id), st=ST[(ev&&ev.status)||'todo']||ST.todo;
  const outs=(spec.edges||[]).filter(e=>e.from===n.id).map(e=>{ const t=spec.nodes.find(x=>x.id===e.to); return (e.label?e.label+' → ':'')+(t?t.label:e.to); });
  const seen=new Set(), arts=S.dev.events.filter(e=>e.node===n.id).flatMap(e=>e.artifacts||[]).reverse().filter(a=>{ const k=a.url||a.path; if(seen.has(k)) return false; seen.add(k); return true; });
  box.innerHTML=`<div><p class="ttl">${esc(n.label||n.id)}</p><span class="id">${esc(n.id)} · ${TYPE_ZH[n.type]||n.type}</span></div>
    <div class="status"><i class="dot" style="background:var(${st.c})"></i>${st.zh}${ev?`<span class="who2">　${fmt(ev.ts)}</span>`:''}</div>
    ${ev&&ev.summary?`<div class="latest">${esc(ev.summary)}</div>`:''}
    ${n.description?`<div class="sec"><h3>做什麼</h3><div>${esc(n.description)}</div></div>`:''}
    <dl class="kv">${n.inputs&&n.inputs.length?`<dt>需要</dt><dd>${n.inputs.map(esc).join('、')}</dd>`:''}${n.outputs&&n.outputs.length?`<dt>產出</dt><dd>${n.outputs.map(esc).join('、')}</dd>`:''}${outs.length?`<dt>下一步</dt><dd>${outs.map(esc).join('<br>')}</dd>`:''}</dl>
    ${n.acceptance&&n.acceptance.length?`<div class="sec"><h3>驗收標準</h3><ul class="acc">${n.acceptance.map(a=>`<li><span class="aid">${esc(a.id)}</span><span>${esc(a.text)}</span></li>`).join('')}</ul></div>`:''}
    ${arts.length?`<div class="sec"><h3>產出物</h3>${artHtml(arts)}</div>`:''}
    <div><button class="linkbtn" id="nodeTl">只看這個節點的紀錄</button></div>`;
  $('nodeTl').onclick=()=>{ S.tlFilter=n.id; renderTimeline(); };
}
function nlabel(id){ const n=S.dev.spec.nodes.find(x=>x.id===id); return n?n.label:(id||'一般'); }
function renderQuestions(){
  const open=openQ(), done=S.dev.questions.filter(q=>q.status==='answered').slice(-5).reverse();
  let h=open.length?open.map(q=>`<div class="q"><div class="meta"><span class="tag">${esc(nlabel(q.node))}</span><span>${esc(who(q.actor))}</span><span>${fmt(q.ts)}</span></div>
    <div class="text">${esc(q.question)}</div><textarea id="ans_${esc(q.id)}" placeholder="在這裡回覆，AI 下次開工時會讀到"></textarea>
    <div class="row"><button class="btn primary" data-ans="${esc(q.id)}">送出回覆</button></div></div>`).join('')
    :`<p class="empty" style="padding-top:8px">目前沒有需要回覆的提問。</p>`;
  if(done.length) h+=`<div class="sec" style="margin-top:12px"><h3>最近已回覆</h3>${done.map(q=>`<div class="q"><div class="meta"><span class="tag">${esc(nlabel(q.node))}</span><span>${fmt(q.answeredAt)}</span></div><div>${esc(q.question)}</div><div class="ans">${esc(q.answer)}<span class="who2">　— ${esc(who(q.answeredBy))}</span></div></div>`).join('')}</div>`;
  $('qs').innerHTML=h;
  $('qs').querySelectorAll('[data-ans]').forEach(b=>b.onclick=async()=>{ const ta=$('ans_'+b.dataset.ans); if(!ta.value.trim()){ ta.focus(); toast('請先輸入回覆內容'); return; }
    const r=await act(b,'pageAnswer',S.project,b.dataset.ans,ta.value).catch(()=>null); if(r){ S.dev=r; renderDev(); toast('已送出回覆'); } });
}
function renderTimeline(){
  const evs=S.dev.events.filter(e=>!S.tlFilter||e.node===S.tlFilter).slice().reverse();
  $('tlAll').hidden=!S.tlFilter;
  $('tl').innerHTML=evs.length?evs.map(e=>{ const st=ST[e.status]||ST.todo; return `<div class="ev"><span class="t">${fmt(e.ts)}</span><div class="body"><div class="head"><span class="nd">${esc(nlabel(e.node))}</span><span class="status" style="font-size:12px"><i class="dot" style="background:var(${st.c})"></i>${st.zh}</span><span class="who2">${esc(who(e.actor))}</span></div>${e.summary?`<div>${esc(e.summary)}</div>`:''}${artHtml(e.artifacts)}</div></div>`; }).join('')
    :`<p class="empty" style="padding-top:8px">${S.tlFilter?'這個節點還沒有紀錄。':'還沒有任何開發紀錄。AI 開始回報後會出現在這裡。'}</p>`;
}

/* ================= 啟動 ================= */
function typing(){ const a=document.activeElement; return a&&/INPUT|TEXTAREA/.test(a.tagName) || [...document.querySelectorAll('textarea,input[type=text]')].some(x=>x.value.trim()); }
$('homeBtn').onclick=async()=>{ if(google.script.history) google.script.history.replace(null,{}); await loadHome(); renderHome(); };
$('refresh').onclick=async e=>{ e.target.disabled=true; try{ await loadHome(); if(S.project) await refreshProject(); else renderHome(); banner(''); }catch(err){ banner((err&&err.message)||'讀取失敗'); } e.target.disabled=false; };
(async()=>{
  try{
    await loadHome();
    const go=id=>{ if(id&&S.projects.some(p=>p.project===id)) return openProject(id); renderHome(); return Promise.resolve(); };
    if(google.script.url) google.script.url.getLocation(loc=>go(loc.parameter&&loc.parameter.project).catch(e=>banner(e.message)));
    else renderHome();
    setInterval(async()=>{ if(document.visibilityState!=='visible'||typing()||!S.project) return; try{ await loadHome(); await refreshProject(); }catch(e){} },60000);
  }catch(e){ banner((e&&e.message)||'讀取失敗'); $('view').innerHTML=''; }
})();
</script>
